# Releasing: change the number in VERSION and push to main.
# This workflow runs the tests, creates the tag (e.g. v0.6.0), builds
# SummonCircle-v0.6.0.zip with the BigWigs packager, and publishes it as a
# GitHub release. WowUp picks up new releases from there.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Released = a GitHub release exists (a bare tag isn't enough).
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag already released; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.v.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Test
        if: steps.v.outputs.exists == 'false'
        run: |
          pip install lupa
          python tests/run.py

      - name: Tag
        if: steps.v.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="${{ steps.v.outputs.tag }}"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag -a "$tag" -m "Summon Circle $tag"
            git push origin "$tag"
          fi

      # Run the BigWigs packager script directly. Its GitHub Action skips
      # branch-push runs whose commit is tagged (it expects a separate
      # tag-push run to package), but here this run IS the release run.
      - name: Package and publish
        if: steps.v.outputs.exists == 'false'
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -q "${{ steps.v.outputs.tag }}"
          curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o "$RUNNER_TEMP/release.sh"
          GITHUB_EVENT_NAME=workflow_dispatch bash "$RUNNER_TEMP/release.sh"
